<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Her Next Mission phoenix logo">
  <title>Her Next Mission</title>
  <defs>
    <linearGradient id="hnm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C870"/>
      <stop offset="55%" stop-color="#C9A04A"/>
      <stop offset="100%" stop-color="#A87B2A"/>
    </linearGradient>
    <linearGradient id="hnm-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2A52"/>
      <stop offset="100%" stop-color="#101A38"/>
    </linearGradient>
    <linearGradient id="hnm-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2C6B"/>
      <stop offset="100%" stop-color="#241B43"/>
    </linearGradient>
  </defs>

  <!-- white circle backdrop -->
  <circle cx="200" cy="200" r="195" fill="#FFFFFF"/>
  <!-- gold ring -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="url(#hnm-gold)" stroke-width="3"/>

  <!-- LEFT WING (navy) -->
  <path fill="url(#hnm-navy)" d="M200 180
    C 160 110, 100 90, 50 100
    C 90 110, 130 130, 160 170
    C 100 150, 60 165, 30 200
    C 80 195, 130 200, 175 220
    C 130 215, 95 240, 80 270
    C 130 245, 175 240, 200 250
    Z"/>

  <!-- RIGHT WING (navy) -->
  <path fill="url(#hnm-navy)" d="M200 180
    C 240 110, 300 90, 350 100
    C 310 110, 270 130, 240 170
    C 300 150, 340 165, 370 200
    C 320 195, 270 200, 225 220
    C 270 215, 305 240, 320 270
    C 270 245, 225 240, 200 250
    Z"/>

  <!-- BODY (purple over wings, white-edged) -->
  <path fill="url(#hnm-purple)" d="M200 100
    C 180 130, 175 160, 195 200
    L 200 270
    L 205 200
    C 225 160, 220 130, 200 100
    Z"/>

  <!-- HEAD -->
  <path fill="url(#hnm-purple)" d="M200 100
    C 196 90, 198 80, 205 78
    C 215 78, 220 88, 215 96
    L 210 102
    Z"/>
  <!-- BEAK (gold) -->
  <path fill="url(#hnm-gold)" d="M214 92 L 226 96 L 214 100 Z"/>
  <!-- crown points -->
  <path fill="url(#hnm-gold)" d="M200 78 L 203 64 L 206 78 Z"/>

  <!-- CENTRAL DIAMOND/STAR (gold, hero) -->
  <path fill="url(#hnm-gold)" d="M200 145
    L 218 195
    L 200 280
    L 182 195
    Z"/>
  <path fill="#FFFFFF" opacity="0.45" d="M200 145 L 209 195 L 200 235 Z"/>

  <!-- TAIL FEATHERS (gold spear-rays) -->
  <g fill="url(#hnm-gold)">
    <path d="M200 270 L 168 350 L 192 305 Z"/>
    <path d="M200 270 L 184 360 L 200 310 Z"/>
    <path d="M200 270 L 200 365 L 208 310 Z"/>
    <path d="M200 270 L 216 360 L 208 305 Z"/>
    <path d="M200 270 L 232 350 L 212 305 Z"/>
  </g>
</svg>
