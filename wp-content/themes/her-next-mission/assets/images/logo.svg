<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-label="Her Next Mission">
  <defs>
    <linearGradient id="hnmTag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8EA"/>
    </linearGradient>
    <linearGradient id="hnmTagEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#C8C9CC"/>
      <stop offset="100%" stop-color="#9A9CA0"/>
    </linearGradient>
    <linearGradient id="hnmRocketBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#374961"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
  </defs>

  <!-- chain ring -->
  <circle cx="160" cy="22" r="18" fill="none" stroke="url(#hnmTagEdge)" stroke-width="6"/>

  <!-- dog tag body -->
  <rect x="40" y="48" width="240" height="370" rx="22" ry="22"
        fill="url(#hnmTag)" stroke="url(#hnmTagEdge)" stroke-width="2"/>

  <!-- ring hole on tag -->
  <circle cx="160" cy="68" r="9" fill="none" stroke="#9A9CA0" stroke-width="2"/>
  <circle cx="160" cy="68" r="6" fill="#0A2540" opacity="0.85"/>

  <!-- 3 silver stars -->
  <g fill="#9A9CA0" transform="translate(0 0)">
    <polygon points="125,98 128,107 137,107 130,113 132,122 125,116 118,122 120,113 113,107 122,107"/>
    <polygon points="160,94 163,103 173,103 165,109 168,118 160,112 152,118 155,109 147,103 157,103"/>
    <polygon points="195,98 198,107 207,107 200,113 202,122 195,116 188,122 190,113 183,107 192,107"/>
  </g>

  <!-- HER -->
  <text x="160" y="172" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="800" letter-spacing="2" fill="#0A2540">HER</text>
  <line x1="74" y1="184" x2="246" y2="184" stroke="#C8102E" stroke-width="3"/>

  <!-- NEXT -->
  <text x="160" y="232" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="2" fill="#0A2540">NEXT</text>

  <!-- MISSION -->
  <text x="160" y="290" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="2" fill="#0A2540">MISSION</text>
  <line x1="74" y1="302" x2="246" y2="302" stroke="#C8102E" stroke-width="3"/>

  <!-- service to success -->
  <text x="160" y="328" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="600" letter-spacing="3" fill="#0A2540">FROM SERVICE TO SUCCESS</text>

  <!-- rocket glyph -->
  <g transform="translate(140 348)">
    <path d="M20 0 C 28 8 32 20 32 32 L 32 56 L 8 56 L 8 32 C 8 20 12 8 20 0 Z"
          fill="url(#hnmRocketBody)"/>
    <circle cx="20" cy="22" r="4" fill="#D6206E"/>
    <path d="M8 48 L 0 64 L 10 58 Z" fill="#0A2540"/>
    <path d="M32 48 L 40 64 L 30 58 Z" fill="#0A2540"/>
    <!-- exhaust -->
    <path d="M14 56 L 16 70 L 20 60 L 24 70 L 26 56 Z" fill="#D6206E" opacity="0.9"/>
    <path d="M16 60 L 17 68 L 20 64 L 23 68 L 24 60 Z" fill="#FFCB57" opacity="0.85"/>
  </g>
</svg>
