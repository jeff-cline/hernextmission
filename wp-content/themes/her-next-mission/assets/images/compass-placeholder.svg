<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Compass — placeholder">
  <defs>
    <radialGradient id="cpDial" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FAFAF6"/>
      <stop offset="100%" stop-color="#E5DFD3"/>
    </radialGradient>
    <linearGradient id="cpRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5D4A1"/>
      <stop offset="100%" stop-color="#8A6F3D"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#cpRim)"/>
  <circle cx="200" cy="200" r="170" fill="url(#cpDial)"/>
  <circle cx="200" cy="200" r="155" fill="none" stroke="#0A2540" stroke-width="1" opacity="0.2"/>
  <!-- cardinal marks -->
  <g fill="#0A2540" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="600" text-anchor="middle">
    <text x="200" y="60">N</text>
    <text x="200" y="355">S</text>
    <text x="60" y="208">W</text>
    <text x="340" y="208">E</text>
  </g>
  <!-- needle -->
  <polygon points="200,75 215,200 200,210 185,200" fill="#C9A961"/>
  <polygon points="200,325 215,200 200,210 185,200" fill="#0A2540" opacity="0.8"/>
  <circle cx="200" cy="200" r="10" fill="#0A2540"/>
  <circle cx="200" cy="200" r="4" fill="#C9A961"/>
  <!-- "true north" hint -->
  <text x="200" y="100" text-anchor="middle" fill="#C9A961"
        font-family="'Inter', sans-serif" font-size="9" letter-spacing="3" font-weight="600">TRUE NORTH</text>
</svg>
