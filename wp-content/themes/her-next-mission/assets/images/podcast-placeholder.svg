<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Podcast cover — placeholder">
  <defs>
    <linearGradient id="ppBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#061A2E"/>
    </linearGradient>
    <linearGradient id="ppGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5D4A1"/>
      <stop offset="100%" stop-color="#C9A961"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#ppBg)"/>

  <!-- mic glyph -->
  <g transform="translate(300 240)" fill="url(#ppGold)">
    <rect x="-32" y="-92" width="64" height="160" rx="32" />
    <rect x="-50" y="14" width="100" height="14" rx="6" opacity="0.6"/>
  </g>
  <line x1="300" y1="296" x2="300" y2="340" stroke="#C9A961" stroke-width="6" stroke-linecap="round"/>
  <line x1="240" y1="340" x2="360" y2="340" stroke="#C9A961" stroke-width="6" stroke-linecap="round"/>

  <!-- text -->
  <text x="300" y="430" text-anchor="middle" fill="#F5F0E8"
        font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="500" letter-spacing="2">
    HER NEXT MISSION
  </text>
  <text x="300" y="470" text-anchor="middle" fill="#E5D4A1" opacity="0.85"
        font-family="'Inter', sans-serif" font-size="14" letter-spacing="6" font-weight="600">
    THE PODCAST
  </text>
</svg>
