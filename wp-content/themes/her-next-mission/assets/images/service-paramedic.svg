<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Woman paramedic">
  <title>Woman paramedic</title>
  <defs>
    <linearGradient id="bg-med" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241B43"/>
      <stop offset="100%" stop-color="#0F0B22"/>
    </linearGradient>
    <linearGradient id="gold-med" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C870"/>
      <stop offset="100%" stop-color="#A87B2A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg-med)"/>
  <!-- shirt -->
  <path d="M120 750 C 140 510, 220 450, 300 450 C 380 450, 460 510, 480 750 Z" fill="#162144"/>
  <!-- shoulder patches -->
  <rect x="135" y="540" width="55" height="65" rx="4" fill="url(#gold-med)"/>
  <rect x="410" y="540" width="55" height="65" rx="4" fill="url(#gold-med)"/>
  <!-- star of life on right shoulder -->
  <g transform="translate(437,572)" fill="#162144">
    <circle r="14"/>
  </g>
  <g transform="translate(437,572)" stroke="url(#gold-med)" stroke-width="2.5" stroke-linecap="round">
    <line x1="-12" y1="0" x2="12" y2="0"/>
    <line x1="-6" y1="-10" x2="6" y2="10"/>
    <line x1="-6" y1="10" x2="6" y2="-10"/>
  </g>
  <!-- chest patch -->
  <rect x="225" y="510" width="150" height="36" fill="#FFFFFF" rx="2"/>
  <text x="300" y="534" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" fill="#162144" letter-spacing="3">PARAMEDIC</text>
  <!-- collar -->
  <path d="M255 450 L 300 520 L 345 450 Z" fill="#0F1937"/>
  <!-- neck -->
  <rect x="282" y="420" width="36" height="50" fill="#E2C2A6"/>
  <!-- head -->
  <ellipse cx="300" cy="370" rx="78" ry="90" fill="#E8CCAD"/>
  <!-- hair (curly, fuller) -->
  <path d="M210 320 C 200 250, 270 215, 310 215 C 360 215, 395 250, 395 320 L 400 380 C 402 410, 388 432, 376 442 L 376 408 C 380 380, 378 348, 368 320 C 332 340, 270 340, 232 320 C 222 348, 220 380, 224 408 L 224 442 C 212 432, 198 410, 200 380 Z" fill="#2A1A12"/>
  <!-- volume curls -->
  <circle cx="240" cy="270" r="20" fill="#2A1A12"/>
  <circle cx="270" cy="245" r="22" fill="#2A1A12"/>
  <circle cx="320" cy="240" r="22" fill="#2A1A12"/>
  <circle cx="360" cy="270" r="20" fill="#2A1A12"/>
  <!-- eyes -->
  <ellipse cx="275" cy="372" rx="6" ry="3.5" fill="#1F1A14"/>
  <ellipse cx="325" cy="372" rx="6" ry="3.5" fill="#1F1A14"/>
  <!-- brows -->
  <path d="M262 357 Q 275 351 290 357" stroke="#2A1A12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M310 357 Q 325 351 338 357" stroke="#2A1A12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M298 382 Q 295 405 302 412" stroke="#C4A685" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- mouth (warm smile) -->
  <path d="M283 422 Q 300 435 317 422" stroke="#9B5A55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- stethoscope -->
  <path d="M260 480 C 240 540, 240 600, 260 640" stroke="#0E1530" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M340 480 C 360 540, 360 600, 340 640" stroke="#0E1530" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="300" cy="700" r="22" fill="url(#gold-med)" stroke="#1F2A52" stroke-width="2"/>
  <circle cx="300" cy="700" r="14" fill="#1F2A52"/>
</svg>
