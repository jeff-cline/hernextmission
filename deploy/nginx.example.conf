# Sample Nginx server block for hernextmission.org — STATIC ONLY.
#
# Place at /etc/nginx/sites-available/hernextmission.org (and symlink
# from sites-enabled/), then:
#   nginx -t && systemctl reload nginx
#
# This config has NO PHP. Any /wp-admin/, /wp-login.php, etc. request
# returns 404. WordPress cannot run from this docroot even if files
# exist.

# Redirect HTTP -> HTTPS (Certbot or your TLS provider already populates this)
server {
    listen 80;
    listen [::]:80;
    server_name hernextmission.org www.hernextmission.org;
    return 301 https://hernextmission.org$request_uri;
}

# Redirect www -> apex over HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hernextmission.org;

    # ssl_certificate / ssl_certificate_key handled by Certbot

    return 301 https://hernextmission.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hernextmission.org;

    root /var/www/hernextmission/site;
    index index.html;

    # ssl_certificate / ssl_certificate_key handled by Certbot

    # ----- Hard 404 every WordPress URL -----
    # Even if leftover wp-* files exist, return 404 with no PHP.
    location ~* ^/(wp-admin|wp-login\.php|wp-includes|wp-content|wp-config\.php|wp-cron\.php|xmlrpc\.php|wp-trackback\.php|wp-comments-post\.php|wp-mail\.php|wp-signup\.php|wp-activate\.php|wp-blog-header\.php|wp-load\.php|wp-settings\.php) {
        return 404;
    }
    location ~* \.(php|phtml|phar)$ { return 404; }

    # ----- Static site -----
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ----- Asset caching -----
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        access_log off;
    }

    # llms.txt / robots.txt / sitemap — no caching
    location ~* ^/(llms\.txt|robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ----- Security headers -----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "interest-cohort=(), geolocation=()" always;

    # ----- Logs -----
    access_log /var/log/nginx/hernextmission.access.log;
    error_log  /var/log/nginx/hernextmission.error.log;
}
