<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Her Next Mission compass">
  <title>HNM compass</title>
  <defs>
    <linearGradient id="fv-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C870"/>
      <stop offset="100%" stop-color="#A87B2A"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#FFFFFF" stroke="#1F2A52" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#fv-gold)" stroke-width="1.2"/>
  <!-- N marker -->
  <path d="M32 6 L34 10 L30 10 Z" fill="#1F2A52"/>
  <!-- needle pointing N — gold/navy bowtie -->
  <path d="M32 32 L37 36 L32 12 Z" fill="#1F2A52"/>
  <path d="M32 32 L27 28 L32 52 Z" fill="url(#fv-gold)"/>
  <circle cx="32" cy="32" r="2.6" fill="#3D2C6B"/>
  <!-- N letter -->
  <text x="32" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="700" fill="#1F2A52">N</text>
</svg>
